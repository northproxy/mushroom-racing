[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroom-racing"
version = "0.1.0"
description = "Explainable geospatial mushroom habitat and fruiting-opportunity model for Austria"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3.0",
    "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
